
# Application
spring.application.name=localconnector

# PostgreSQL Database
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/localconnector}
spring.datasource.username=${DB_USERNAME:lc_app}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway Database Migrations
spring.flyway.enabled=true